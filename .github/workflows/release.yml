name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
# ── Linux musl (zero deps, any kernel ≥ 2.6) ──
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-amd64
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux-arm64
            ext: ""
          # ── macOS (target macOS 11+) ──
          - target: x86_64-apple-darwin
            os: macos-13
            platform: macos-amd64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-14
            platform: macos-arm64
            ext: ""
          # ── Windows ──
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-amd64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v5

      - name: Install deps (musl)
        if: startsWith(matrix.target, 'x86_64-unknown-linux-musl') || startsWith(matrix.target, 'aarch64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          # musl: setting RUSTFLAGS drops the target's implicit +crt-static, which would
          # yield a dynamically linked musl binary (needs the musl loader on the target).
          # Re-state it explicitly so linux-amd64/arm64 stay self-contained.
          RUSTFLAGS: ${{ startsWith(matrix.target, 'x86_64-unknown-linux-musl') || startsWith(matrix.target, 'aarch64-unknown-linux-musl') && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.os, 'macos') && '11.0' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          BIN="aimail-bridge-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}"
          cp target/${{ matrix.target }}/release/aimail-bridge${{ matrix.ext }} "$BIN"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: aimail-bridge-${{ github.ref_name }}-${{ matrix.platform }}
          path: aimail-bridge-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v5
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: aimail-bridge-${{ github.ref_name }}-*/*
          body: |
            ## Platform variants

            | Suffix | Compatible with |
            |--------|-----------------|
            | `linux-amd64` | musl, **no runtime deps** |
            | `linux-arm64` | musl, **no runtime deps** |
            | `macos-amd64` | macOS 11+ (Intel) |
            | `macos-arm64` | macOS 11+ (Apple Silicon) |
            | `windows-amd64` | Windows 10+ |

            All TLS crypto is pure Rust (ring/rustls) — no OpenSSL required on any platform.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
