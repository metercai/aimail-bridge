name: gates

# 每次 push / PR 的测试 + **跨平台编译**闸门。
#
# 为什么需要它：`src/lifecycle.rs` 的 `cfg(not(unix))` 分支(tasklist/taskkill) 与
# `src/main.rs` 的 `cfg(windows)` daemonize 在 Linux 上**根本不参与编译** ——
# 只靠 release.yml(tag 时才跑)会让首个 tag 变成"第一次编译 Windows 路径"。
# 这里把非 linux 目标的 `cargo check` 变成每次提交的常规闸门。
#
# 尚未纳入门禁的既有欠账（2026-09-20 实测，独立清理项，不在此处放水）：
#   · `cargo clippy --all-targets -- -D warnings` → 11 处既有命中（如
#     src/pull.rs 的 `2_u64.pow(3.min(6))` unnecessary_min_or_max）
#   · `cargo fmt --check` → 既有漂移（src/acme.rs 的 import 顺序/长行折行）
# 两者都在**本工作线之前**就存在；修好后再把对应步骤加回来。

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --all-targets

  cross-check:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cargo check (compiles the platform-specific cfg paths)
        run: cargo check --all-targets --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -D warnings
