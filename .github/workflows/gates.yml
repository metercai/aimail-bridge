name: gates

# 每次 push / PR 的测试 + **跨平台编译**闸门。
#
# 为什么需要它：`src/lifecycle.rs` 的 `cfg(not(unix))` 分支(tasklist/taskkill) 与
# `src/main.rs` 的 `cfg(windows)` daemonize 在 Linux 上**根本不参与编译** ——
# 只靠 release.yml(tag 时才跑)会让首个 tag 变成"第一次编译 Windows 路径"。
#
# 关键：平台目标必须跑在**对应原生 runner** 上。在 ubuntu 上交叉 check 会在
# ring 的 C 构建阶段失败(msvc 需 lib.exe / gnu 需 x86_64-w64-mingw32-gcc，
# 2026-09-20 本机实测两种都缺) —— 那不是代码问题, 是工具链问题, 故不能拿它当闸门。
#
# 两条 2026-09-21 实测修正（与 release.yml 对齐, 闸门与发布口径必须一致）：
#   1) `linux-musl-x86_64` 在 ubuntu 上是**交叉** check: ring 的 C/asm 构建脚本走
#      cc-rs 需要目标 C 编译器, 缺 `musl-gcc` 即报 `failed to find tool`(本机清缓存 +
#      屏蔽 CC 复现); release.yml 早已 `apt-get install musl-tools`, 闸门此前漏装
#      ⇒ 该 job 自 09-20 起确定性失败(c454448/6b1ac21 两 run 同型)。故此处补装。
#   2) `macos-x86_64`(macos-13, Intel) 已实际不可用 —— c454448 起排队 20+ 小时未启动;
#      且该平台**不在 release 目标集**(仅 linux-amd64/arm64 musl、macos-arm64、
#      windows-amd64), `apple-darwin` 的 cfg 与已覆盖的 macos-aarch64 同族
#      ⇒ 对发布无覆盖价值, 移除。
#
# 尚未纳入门禁的既有欠账（2026-09-20 实测，独立清理项，不在此处放水）：
#   · `cargo clippy --all-targets -- -D warnings` → 11 处既有命中（如
#     src/pull.rs 的 `2_u64.pow(3.min(6))` unnecessary_min_or_max）
#   · `cargo fmt --check` → 既有漂移（src/acme.rs 的 import 顺序/长行折行）
# 两者都在**本工作线之前**就存在；修好后再把对应步骤加回来。

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --all-targets

  platform-check:
    name: check ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 平台专属 cfg 路径在各自原生工具链下编译
          - name: windows-x86_64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: linux-musl-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install deps (musl)
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cargo check --all-targets (compiles platform-specific cfg paths)
        run: cargo check --all-targets --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -D warnings
