[package]
name = "aimail-bridge"
version = "0.7.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Transparent push/pull bridge between the AIMail gateway and local agent systems"

[dependencies]
axum = "0.7"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
hyper = "1"

rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }

toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

tokio = { version = "1", features = ["full"] }

notify = "6"
dirs = "5"
regex = "1"

# v1 API signature (aimail-gateway docs/API-SIGNATURE-PROTOCOL.md)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
